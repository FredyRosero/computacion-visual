<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Three.js – Proyección Perspectiva / Ortográfica</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #instrucciones {
      background-color: #FFFFFF10;
      color: white;
      position: absolute;
      z-index: 10;
      min-height: 50px;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>
  <div id="instrucciones">
    <h1>Examen final – Punto 2</h1>
    <p>Presiona "1" → Ortográfica</p>
    <p>Presiona "2" → Perspectiva</p>
  </div>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Definir cámaras ---

    // Perspectiva
    const cameraPersp = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    cameraPersp.position.set(5, 5, 8);

    // Ortográfica — ajustamos tamaño según tamaño de ventana
    function createOrthoCamera() {
      const aspect = window.innerWidth / window.innerHeight;
      const frustumSize = 10;               // puedes ajustar este valor
      const half = frustumSize / 2;
      return new THREE.OrthographicCamera(
        -half * aspect, half * aspect,
        half, -half,
        0.1, 100
      );
    }
    let cameraOrtho = createOrthoCamera();
    cameraOrtho.position.set(5, 5, 8);

    // Cámara activa (por defecto: perspectiva)
    let activeCamera = cameraPersp;

    // --- Controles ---
    const controls = new THREE.OrbitControls(activeCamera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();

    // --- Luces ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // --- Texturas y geometrías (igual que tenías) ---
    const loader = new THREE.TextureLoader();
    const floorTex = loader.load("textures/floor.jpg");
    const boxTex   = loader.load("textures/box.jpg");

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ map: floorTex })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    scene.add(floor);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({ map: boxTex })
    );
    box.position.set(-2, 0.75, 0);
    scene.add(box);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x66ccff })
    );
    sphere.position.set(2, 0.8, 0);
    scene.add(sphere);

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.7, 1.6, 32),
      new THREE.MeshStandardMaterial({ color: 0xffaa00 })
    );
    cone.position.set(0, 0.8, -2);
    scene.add(cone);

    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(0.7, 0.2, 16, 100),
      new THREE.MeshStandardMaterial({ color: 0xaa66ff })
    );
    torus.position.set(0, 0.8, 2);
    scene.add(torus);

    // --- Switch de cámara con teclas ---
    window.addEventListener("keydown", (e) => {
      if (e.key === "1") {
        // Ortográfica
        activeCamera = cameraOrtho;
        controls.object = activeCamera;
        controls.update();
      } else if (e.key === "2") {
        // Perspectiva
        activeCamera = cameraPersp;
        controls.object = activeCamera;
        controls.update();
      }
    });

    // --- Animación ---
    function animate() {
      requestAnimationFrame(animate);

      box.rotation.y += 0.01;
      sphere.position.y = 0.8 + Math.sin(Date.now() * 0.002) * 0.2;
      cone.rotation.x += 0.015;
      torus.rotation.z += 0.02;

      controls.update();
      renderer.render(scene, activeCamera);
    }
    animate();

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);

      // actualizar cámaras
      cameraPersp.aspect = window.innerWidth / window.innerHeight;
      cameraPersp.updateProjectionMatrix();

      cameraOrtho = createOrthoCamera();
      cameraOrtho.position.copy(activeCamera.position);
    });
  </script>
</body>
</html>
